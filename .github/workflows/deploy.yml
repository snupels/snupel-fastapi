name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete --exclude .git --exclude .env --exclude .venv \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          ssh "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && set -a && source .env && set +a && test -n \"\${DATABASE_URL:-}\" && ~/.local/bin/uv sync --frozen --no-dev && ~/.local/bin/uv run alembic upgrade head && sudo install -m 644 deploy/snupel-fastapi.service deploy/snupel-tourism-sync.service deploy/snupel-tourism-sync.timer /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable snupel-fastapi snupel-tourism-sync.timer && sudo systemctl restart snupel-fastapi snupel-tourism-sync.timer && sudo systemctl restart snupel-tourism-sync.service"
