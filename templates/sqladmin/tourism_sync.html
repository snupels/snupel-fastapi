{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="container-xl">
  <div class="card">
    <div class="card-header"><h3 class="card-title">Tourism crawler sync</h3></div>
    <div class="card-body">
      {% if result %}
      <div class="alert alert-success" role="alert">
        {% for source, count in result.items() %}{{ source }}={{ count }}{% if not loop.last %}, {% endif %}{% endfor %}
      </div>
      {% endif %}
      <form method="post">
        <button class="btn btn-primary" type="submit">Sync now</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
